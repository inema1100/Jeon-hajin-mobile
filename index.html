<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>정하진 | Digital Life</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap');

:root {
  --bg:#111214;
  --phone:#17191c;
  --surface:#22252a;
  --surface2:#292d33;
  --surface3:#333840;
  --text:#f1f0ed;
  --muted:#999da5;
  --dim:#666b74;
  --accent:#c2a783;
  --accent2:#e0c9a7;
  --blue:#8199b8;
  --line:rgba(255,255,255,.075);
  --green:#8da78e;
  --radius:17px;
}

* {box-sizing:border-box}
body {
  margin:0;
  background:#101113;
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}
button {font:inherit}
button, [data-action], [data-open] {
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button:active,[data-action]:active,.app-icon:active {
  transform:scale(.96);
  filter:brightness(1.2);
}
.phone {
  width:min(410px,100%);
  height:min(880px,calc(100dvh - 36px));
  min-height:570px;
  position:relative;
  background:var(--phone);
  border:7px solid #303238;
  border-radius:43px;
  overflow:hidden;
  box-shadow:0 25px 100px rgba(0,0,0,.65),inset 0 0 0 1px #505258;
}
.phone:before {
  content:"";
  position:absolute;
  width:90px;height:23px;
  border-radius:20px;
  background:#090a0b;
  top:8px;left:50%;
  transform:translateX(-50%);
  z-index:100;
  pointer-events:none;
}
.status {
  position:absolute;
  z-index:110;
  top:0;left:0;right:0;
  height:38px;
  padding:9px 22px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font:600 11px 'DM Sans',sans-serif;
  pointer-events:none;
  color:white;
}
.status-right {display:flex;gap:6px;align-items:center}
.battery {
  width:20px;height:10px;
  border:1px solid rgba(255,255,255,.85);
  border-radius:3px;
  position:relative;
  padding:1px;
}
.battery:after {
  content:"";position:absolute;
  right:-3px;top:2px;
  width:2px;height:4px;
  background:white;
}
.battery-fill {width:84%;height:100%;background:#a9c39d;border-radius:1px}
.screen {
  position:absolute;
  inset:0;
  padding-top:38px;
  padding-bottom:28px;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateX(18px);
  transition:opacity .19s ease,transform .22s ease,visibility .19s;
  overflow:hidden;
  background:#17191d;
}
.screen.active {
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateX(0);
  z-index:2;
}
.screen-content {
  height:100%;
  overflow-y:auto;
  scrollbar-width:none;
  overscroll-behavior:contain;
}
.screen-content::-webkit-scrollbar {display:none}
.navbar {
  position:absolute;
  bottom:0;left:0;right:0;
  height:27px;
  z-index:120;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(18,19,21,.82);
  backdrop-filter:blur(15px);
}
.navbar button {
  width:105px;height:5px;
  border:0;border-radius:10px;
  background:#d6d6d6;
  padding:0;
}
button {border:0;color:inherit}
.header {
  height:58px;
  padding:0 19px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(23,25,29,.95);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.header-title {font-size:17px;font-weight:700}
.back {
  background:none;
  font-size:25px;
  width:42px;height:44px;
  color:var(--text);
  text-align:left;
}
.header-action {
  min-width:40px;height:42px;
  background:none;color:var(--accent2);
  font-size:13px;
}
.section {padding:19px}
.section-title {
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  letter-spacing:.7px;
  margin:20px 0 11px;
}
.card {
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:15px;
  margin-bottom:11px;
}
.muted {color:var(--muted)}
.small {font-size:11px}
.tiny {font-size:10px;color:var(--muted)}
.divider {height:1px;background:var(--line);margin:12px 0}
.row {display:flex;align-items:center;gap:12px}
.between {display:flex;align-items:center;justify-content:space-between}
.avatar {
  width:43px;height:43px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#45474a;color:#e5d5c1;
  font-size:16px;flex-shrink:0;
}
.avatar.gold {background:#625341}
.avatar.blue {background:#3b4c60}
.avatar.pink {background:#6a4d51}
.pill {
  padding:4px 8px;border-radius:20px;
  font-size:10px;background:#393d42;color:#c6c8cb;
}
.accent {color:var(--accent2)}
.app-icon {
  width:53px;height:53px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  position:relative;
  box-shadow:0 3px 9px rgba(0,0,0,.25);
  transition:transform .12s;
}
.app-label {
  font-size:10px;
  text-align:center;
  margin-top:6px;
  color:white;
  white-space:nowrap;
}
.app-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:19px 8px;
}
.app-cell {
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:0;
  cursor:pointer;
}
.badge {
  position:absolute;
  right:-5px;top:-5px;
  background:#d04e50;
  color:white;
  font:700 9px 'DM Sans';
  border-radius:20px;
  padding:3px 5px;
  min-width:18px;
  text-align:center;
  border:2px solid #24272b;
}
.folder-icon {
  width:55px;height:52px;
  border-radius:13px;
  background:#55565a;
  display:grid;
  grid-template-columns:repeat(2,17px);
  gap:3px;
  align-content:center;
  justify-content:center;
}
.folder-icon span {
  height:17px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
}
.home-screen {
  background:#292a2d;
  position:relative;
}
.home-screen:before {
  content:"";
  position:absolute;inset:0;
  background:

  radial-gradient(ellipse at 50% 40%,#74716c 0%,#39383a 58%,#1d1e20 100%);
  pointer-events:none;
}
.home-screen:after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent 38%,rgba(10,11,13,.38) 75%);
  pointer-events:none;
}
.wallpaper-person {
  position:absolute;
  top:15%;left:50%;
  transform:translateX(-50%);
  width:205px;height:275px;
  border-radius:105px 105px 30px 30px;
  background:linear-gradient(150deg,#c9c2b4,#a9a397 45%,#6f7473);
  opacity:.23;
  filter:blur(1px);
  pointer-events:none;
}
.home-clock {
  position:absolute;
  top:78px;left:0;right:0;
  text-align:center;
  z-index:1;
  text-shadow:0 2px 15px #222;
}
.home-clock .time {font:300 57px 'DM Sans';letter-spacing:-3px}
.home-clock .date {font-size:12px;color:#e5dfd4;margin-top:2px}
.home-quote {
  position:absolute;
  top:220px;
  left:0;right:0;
  text-align:center;
  z-index:1;
  font-size:11px;
  color:#e6ded1;
  letter-spacing:.2px;
}
.home-bottom {
  position:absolute;
  bottom:45px;left:15px;right:15px;
  z-index:3;
}
.widget {
  background:rgba(22,24,27,.74);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:17px;
  padding:12px 14px;
  margin-bottom:15px;
}
.weather-icon {font-size:26px}
.widget-small {font-size:10px;color:#c1c1c1}
.widget-large {font-size:20px;font-weight:600}
.home-icons {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px 4px;
  margin-bottom:15px;
}
.dock {
  background:rgba(25,26,29,.82);
  border-radius:22px;
  padding:10px 8px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  backdrop-filter:blur(15px);
}
.dock .app-icon {width:49px;height:49px}
.app-page {padding-bottom:25px}
.profile {
  text-align:center;padding:24px 15px 20px;
}
.profile-avatar {
  width:65px;height:65px;border-radius:50%;
  margin:auto auto 10px;
  background:#333940;
  display:flex;align-items:center;justify-content:center;
  font-size:27px;
}
.list-item {
  min-height:67px;
  display:flex;align-items:center;
  padding:10px 15px;
  gap:12px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.list-item:last-child {border-bottom:0}
.list-main {flex:1;min-width:0}
.list-title {font-size:13px;font-weight:600}
.list-sub {font-size:11px;color:var(--muted);margin-top:4px}
.list-end {font-size:10px;color:var(--muted);text-align:right}
.searchbox {
  background:#2a2d32;border-radius:12px;
  padding:12px 14px;
  color:#a8a9ac;
  font-size:12px;
  margin-bottom:15px;
}
.chat-bubble {
  max-width:79%;
  padding:11px 13px;
  border-radius:15px;
  font-size:12px;
  line-height:1.65;
  word-break:keep-all;
  position:relative;
}
.chat-bubble.mine {
  background:#bca483;color:#24221f;
  border-radius:15px 4px 15px 15px;
  margin-left:auto;
}
.chat-bubble.theirs {
  background:#30343a;color:#f1f0ed;
  border-radius:4px 15px 15px 15px;
}
.chat-line {display:flex;gap:7px;margin-bottom:13px;align-items:flex-end}
.chat-time {font-size:9px;color:#81858b;white-space:nowrap}
.chat-date {
  text-align:center;
  margin:17px auto;
  font-size:10px;
  color:#a2a4a9;
  background:#292d32;
  border-radius:20px;
  width:max-content;padding:5px 12px;
}
.chat-input {
  position:sticky;bottom:0;
  padding:10px 12px;
  background:#22252a;
  display:flex;gap:8px;
  border-top:1px solid var(--line);
}
.chat-input input {
  flex:1;min-width:0;
  background:#35383e;border:0;border-radius:20px;
  padding:11px 14px;color:white;outline:none;
}
.chat-input button {
  width:43px;height:43px;border-radius:50%;
  background:var(--accent);color:#25221e;
}
.gallery {
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:3px;
}
.photo {
  aspect-ratio:1;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:#3d4145;
  font-size:35px;
  position:relative;
  overflow:hidden;
}
.photo:nth-child(3n+1) {background:#4d4a45}
.photo:nth-child(3n+2) {background:#42494a}
.photo:nth-child(3n) {background:#5a4e49}
.photo span {filter:drop-shadow(0 3px 5px #222)}
.photo-detail {
  height:300px;
  display:flex;align-items:center;justify-content:center;
  font-size:100px;
  background:linear-gradient(145deg,#57544d,#30363b);
  border-radius:16px;
}
.note-content {
  white-space:pre-line;
  font-size:13px;
  line-height:2;
  color:#dedbd4;
}
.note-paper {
  background:#25282c;
  padding:20px;
  border-radius:14px;
  min-height:250px;
}
.event {
  display:flex;gap:13px;padding:13px 0;
  border-bottom:1px solid var(--line);
}
.event-date {
  width:45px;text-align:center;
  font-size:12px;color:var(--accent2);
}
.event-date strong {font:600 21px 'DM Sans';display:block}
.album-cover {
  width:100%;aspect-ratio:1.4;
  display:flex;align-items:center;justify-content:center;
  font-size:50px;border-radius:12px;
  background:linear-gradient(145deg,#5a554d,#292e33);
}
.track {
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.track-art {
  width:43px;height:43px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:#45413d;font-size:20px;
}
.progress {
  height:3px;border-radius:10px;background:#444;
  margin:17px 0 8px;overflow:hidden;
}
.progress span {display:block;width:37%;height:100%;background:var(--accent)}
.keyboard {
  display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;
}
.keyboard span {
  background:#34383d;border-radius:8px;padding:7px 10px;font-size:12px;
}
.toast {
  position:absolute;bottom:50px;left:50%;
  transform:translate(-50%,15px);
  background:#ded0bb;color:#29251f;
  padding:10px 17px;border-radius:20px;
  font-size:11px;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:.2s;z-index:200;
}
.toast.show {opacity:1;transform:translate(-50%,0)}
.lock {
  background:linear-gradient(180deg,#282727,#575047 55%,#191a1b);
}
.lock-art {
  position:absolute;top:26%;left:50%;

  border-radius:50%;

}
.lock-art:after {
  content:"";
  position:absolute;
  width:140px;height:80px;
  left:37px;top:120px;
  background:linear-gradient(160deg,#e6ddca,#a9a08e);

}
.lock-time {
  position:absolute;top:90px;left:0;right:0;

.lock-date {

.lock-bottom {

}
.lock-hint {font-size:10px;color:#ddd;margin-bottom:15px}
.lock-screen {background:#292826}
.lock-entry {position:absolute;left:18px;right:18px;bottom:34px;z-index:5;text-align:center}
.lock-feedback {height:18px;margin-bottom:9px;font-size:11px;color:#ead7bd}
.lock-dots {display:flex;justify-content:center;gap:12px;margin-bottom:13px}
.lock-dot {width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.9)}
.lock-dot.filled {background:#fff}
.lock-keypad {display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:270px;margin:0 auto}

.empty {padding:40px 20px;text-align:center;color:var(--muted);font-size:12px}
.tag {font-size:10px;color:var(--accent2);background:#413b32;border-radius:5px;padding:4px 7px}
.fin-row {display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.fin-row:last-child {border-bottom:0}
.fin-val {font-weight:600;white-space:nowrap;text-align:right;font-family:'DM Sans','Noto Sans KR',sans-serif}
.fin-quote {background:var(--surface2);border-left:2px solid var(--accent);padding:10px 12px;border-radius:8px;font-size:11px;line-height:1.7;color:#dcd8d0;margin-top:10px}
input {font:inherit}
</style>
</head>

function toast(msg) {
 const el=$('#toast');
 el.textContent=msg;
 el.classList.add('show');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

function clock() {
 const d=new Date();
 const time=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 ['#statusTime','#homeTime','#lockTime'].forEach(sel=>{const el=$(sel);if(el)el.textContent=time;});
}
setInterval(()=>{try{clock()}catch(e){}},1000);

function dateText() {
 const d=new Date();
 return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
}

function panel(id,html,cls='') {
 const el=document.createElement('div');
 el.className='screen '+cls;
 el.dataset.screen=id;
 el.innerHTML=html;
 screens.appendChild(el);
 return el;
}

function activate(id) {
 [...screens.children].forEach(s=>{
  s.classList.toggle('active',s.dataset.screen===id);
 });
}

function openScreen(id,html,cls='') {
 if(stack.length && stack[stack.length-1]===id) return;
 panel(id,html,cls);
 stack.push(id);
 activate(id);
}

function replaceScreen(id,html) {
 const old=$(`[data-screen="${stack[stack.length-1]}"]`);
 if(old) old.remove();
 panel(id,html);
 stack[stack.length-1]=id;
 activate(id);
}

function goBack() {
 if(stack[stack.length-1]==='lock') return;
 if(stack.length<=1){goHome();return}
 const id=stack.pop();
 const el=$(`[data-screen="${id}"]`);
 if(el) el.remove();
 activate(stack[stack.length-1]);
}

function goHome() {
 if(stack[stack.length-1]==='lock') return;
 stack.splice(1);
 [...screens.children].forEach(s=>{
  if(s.dataset.screen!=='home')s.remove();
 });
 activate('home');
}

 [['📦','쿠팡','coupang'],['🥬','마켓컬리','kurly'],['🍜','배달의민족','baemin'],['🍽','캐치테이블','catchtable'],['📖','만개의레시피','recipe']]:
 type==='finance'?
 [['🏦','주거래 은행','finance'],['💳','저축 은행','finance'],['📈','증권사','finance']]:
 [['⚽','구단 컨디션 관리','training'],['📊','피지컬 데이터','training'],['🎥','Wyscout','training'],['🌙','수면 패턴','training']];
 openScreen('folder-'+type,appShell(isDaily?'일상':type==='finance'?'금융':'구단 및 훈련',`
 <div class="section"><div class="app-grid" style="grid-template-columns:repeat(3,1fr);gap:24px">
 ${items.map(x=>`<div class="app-cell" data-open="${x[2]}"><div class="app-icon" style="background:#484c50">${x[0]}</div><div class="app-label">${x[1]}</div></div>`).join('')}
 </div></div>`));
}

function showPage(title) {
 openScreen('webpage-'+Date.now(),appShell('페이지 정보',`
 <div class="section">
 <div class="card">
 <div class="tiny">Safari · 방문 기록</div>
 <div style="font-size:16px;font-weight:700;margin-top:12px">${escapeHTML(title)}</div>
 <div class="divider"></div>
 <div style="font-size:12px;line-height:1.9;color:#c5c4c0">
 개인적으로 찾아본 정보입니다. ■■ 씨에게 더 좋은 것을 해주기 위해 참고하고 있는 자료입니다.
 </div>
 </div>
 <div class="section-title">저장된 페이지</div>
 <div class="card"><div class="list-title">읽기 목록에 추가됨</div><div class="tiny" style="margin-top:6px">나중에 다시 읽을 수 있도록 보관했습니다.</div></div>
 </div>`));
}

function sendChat() {
 const input=$('#chatInput');
 if(!input || !input.value.trim())return;
 const val=input.value.trim();
 if(!sentMessages[currentChat])sentMessages[currentChat]=[];
 sentMessages[currentChat].push(['me',val]);
 const msgs=$('#chatMessages');
 if(msgs) {
  const div=document.createElement('div');
  div.className='chat-line';
  div.style.justifyContent='flex-end';
  const bubble=document.createElement('div');
  bubble.className='chat-bubble mine';
  bubble.textContent=val;
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
 }
 input.value='';
 toast('메시지가 기록되었습니다.');
}

document.addEventListener('click',e=>{
 const actionEl=e.target.closest('[data-action]');
 const openEl=e.target.closest('[data-open]');
 const chatEl=e.target.closest('[data-chat]');
 const photoEl=e.target.closest('[data-photo]');
 const albumEl=e.target.closest('[data-album]');
 const noteEl=e.target.closest('[data-note]');
 const folderEl=e.target.closest('[data-note-folder]');
 const callEl=e.target.closest('[data-call]');
 const searchEl=e.target.closest('[data-search]');
 const pageEl=e.target.closest('[data-page]');
 const logEl=e.target.closest('[data-setlog]');
 const toolEl=e.target.closest('[data-tool]');
 const financeEl=e.target.closest('[data-finance]');
 const cartEl=e.target.closest('[data-cart]');
 const trackEl=e.target.closest('[data-track]');
 const alarmEl=e.target.closest('[data-alarm]');
 const socialEl=e.target.closest('[data-social]');

 const lockKey=e.target.closest('[data-lock-key]');
 if(lockKey) {
  const key=lockKey.dataset.lockKey;
  if(key==='del') lockDigits=lockDigits.slice(0,-1);
  else if(key==='enter') {verifyLock();return;}
  else if(/^\d$/.test(key) && lockDigits.length<8) lockDigits+=key;
  updateLockDots();
  if(lockDigits.length===8) verifyLock();
  return;
 }
 if(actionEl) {
  const a=actionEl.dataset.action;
  switch(a) {
   case 'back':goBack();break;
   case 'home':goHome();break;
   case 'unlock':
    verifyLock();break;
   case 'send-chat':sendChat();break;
   case 'call':toast('통화 연결을 준비합니다.');break;
   case 'toggle-play':
    playing=!playing;actionEl.textContent=playing?'Ⅱ':'▶';
    toast(playing?'재생 중':'일시 정지');break;
   case 'previous':toast('이전 곡');break;
   case 'next':toast('다음 곡');break;
   case 'add':toast('새 항목을 준비합니다.');break;
   default:break;
  }
  return;
 }
 if(openEl) {openApp(openEl.dataset.open);return}
 if(chatEl) {openChat(chatEl.dataset.chat);return}
 if(photoEl) {photoDetail(photoEl.dataset.album,Number(photoEl.dataset.photo));return}
 if(albumEl) {albumScreen(albumEl.dataset.album);return}
 if(noteEl) {noteDetail(Number(noteEl.dataset.note));return}
 if(folderEl) {
  const folderName=folderEl.dataset.noteFolder;
  openScreen('note-folder-'+folderName,appShell(folderName,`
  <div class="section">
  ${notes.map((n,i)=>({n,i})).filter(x=>x.n.folder===folderName).map(x=>`<div class="list-item" data-note="${x.i}"><div class="avatar">${folderName==='기억할 것'?'♡':'⚽'}</div><div class="list-main"><div class="list-title">${x.n.title}</div><div class="list-sub">${x.n.date}</div></div><span>›</span></div>`).join('')}
  </div>`));return;
 }
 if(callEl) {
  const idx=Number(callEl.dataset.call);
  if(callEl.dataset.callAction!==undefined) {
   toast('통화 연결을 준비합니다.');
  } else callDetail(idx);
  return;
 }
 if(searchEl) {searchDetail(Number(searchEl.dataset.search));return}
 if(pageEl) {showPage(pageEl.dataset.page);return}
 if(logEl) {setlogDetail(Number(logEl.dataset.setlog));return}
 if(toolEl) {showPage(toolEl.dataset.tool);return}
 if(financeEl) {financeDetail(financeEl.dataset.finance);return}
 if(cartEl) {toast(shopping[Number(cartEl.dataset.cart)][1]+' · 결제 전 상품');return}
 if(trackEl) {
  const t=tracks[Number(trackEl.dataset.track)];
  toast('재생 목록: '+t[1]);return;
 }
 if(alarmEl) {
  const i=Number(alarmEl.dataset.alarm);
  alarmEl.style.background=alarmEl.style.background.includes('596')?'#9a8667':'#59636c';
  toast(['기상 알람','훈련 출발 알람','■■ 씨 잘 시간 확인'][i]+' 설정 변경');return;
 }
 if(socialEl) {toast('게시물 기록을 확인했습니다.');return}
});

document.addEventListener('keydown',e=>{
 if(e.key==='Enter' && e.target.id==='chatInput')sendChat();
 if(e.key==='Escape')goBack();
});

let touchStart=0;
$('#phone').addEventListener('touchstart',e=>{
 touchStart=e.changedTouches[0].clientX;
},{passive:true});
$('#phone').addEventListener('touchend',e=>{
 const diff=e.changedTouches[0].clientX-touchStart;
 if(diff>110 && stack.length>1)goBack();
},{passive:true});

});
</script>
</body>
</html>
